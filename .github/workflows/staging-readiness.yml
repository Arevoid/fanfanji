name: Fanfanji staging readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-readiness:
    name: Build and verify staging candidate
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install reproducibly
        run: npm ci --ignore-scripts
      - name: Run complete staging candidate gate
        run: npm run check
      - name: Upload staging candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: fanfanji-staging-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/release-manifest.json
            dist/index.html
            server-dist/server.cjs
